name: build-llama-server

# 在 manylinux_2_28 容器中编译 llama-server，校验 GLIBC 符号版本，并在 debian:10 中启动验证。
# 产物可直接部署到统信 UOS v20。

on:
  push:
    paths:
      - ".github/workflows/build-llama-server.yml"
      - "scripts/build_llama_server.sh"
      - "scripts/check_glibc_symbols.sh"
  pull_request:
    paths:
      - ".github/workflows/build-llama-server.yml"
      - "scripts/build_llama_server.sh"
      - "scripts/check_glibc_symbols.sh"
  workflow_dispatch:
    inputs:
      llama_cpp_ref:
        description: "llama.cpp 的 tag、分支或提交号"
        default: "master"
        type: string
  workflow_call:
    inputs:
      llama_cpp_ref:
        description: "llama.cpp 的 tag、分支或提交号"
        default: "master"
        type: string

env:
  LLAMA_CPP_REF: ${{ inputs.llama_cpp_ref || 'master' }}
  BUILD_IMAGE: quay.io/pypa/manylinux_2_28_x86_64
  TARGET_GLIBC: "2.28"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 在 manylinux_2_28 容器中编译
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" -e LLAMA_CPP_REF \
            "$BUILD_IMAGE" bash scripts/build_llama_server.sh

      - name: 校验 GLIBC 符号版本
        run: bash scripts/check_glibc_symbols.sh dist/llama-server/llama-server "$TARGET_GLIBC"

      - name: 在 debian:10 断网容器中启动验证
        run: |
          docker run --rm --network none -v "$PWD:$PWD" -w "$PWD" debian:10-slim \
            ./dist/llama-server/llama-server --version

      - uses: actions/upload-artifact@v4
        with:
          name: llama-server-linux-x86_64
          path: dist/llama-server/
          retention-days: 30
